name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example, v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          node -e '
            const { version } = require("./app.json").expo;
            const tag = process.env.RELEASE_TAG;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) || tag !== `v${version}`) {
              console.error(`Expected v${version} from app.json; received ${tag}`);
              process.exit(1);
            }
          '
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build signed Android APK
        run: eas build --platform android --profile release --non-interactive --wait --json > eas-build.json

      - name: Download and verify APK
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          BUILD_URL="$(jq -er 'if type == "array" then .[0] else . end | select(.status == "FINISHED") | .artifacts.buildUrl' eas-build.json)"
          APK="TAPSAKAY-${RELEASE_TAG}.apk"
          curl --fail --location --retry 3 --output "$APK" "$BUILD_URL"
          unzip -tqq "$APK"
          sha256sum "$APK" > "${APK}.sha256"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          APK="TAPSAKAY-${RELEASE_TAG}.apk"
          gh release create "$RELEASE_TAG" "$APK" "${APK}.sha256" \
            --target "$GITHUB_SHA" \
            --title "TAPSAKAY $RELEASE_TAG" \
            --generate-notes
