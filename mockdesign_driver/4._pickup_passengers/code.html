<h3 class="font-headline-lg text-headline-lg text-inverse-on-surface">

<div class="flex items-center justify-center gap-space-md my-space-md">

<div class="w-20 h-20 rounded-full bg-surface-container-lowest/15 flex items-center justify-center shadow-inner">

            person
          </span>
